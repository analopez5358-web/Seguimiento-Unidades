<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Unidades</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>Seguimiento de Unidades</h1>
        <p>Programación y actualización de unidades</p>
    </header>

    <main class="container">
        <!-- Sección para Programar Unidad -->
        <section class="card">
            <h2>🚚 Programar unidad</h2>
            <p class="instruction">Selecciona una placa y su destino. Después solo tendrás que actualizar la ubicación.</p>
            
            <div class="form-group">
                <label for="selectPlaca">Placa</label>
                <select id="selectPlaca">
                    <option value="">Seleccionar placa</option>
                    <option value="TCA2222">TCA2222</option>
                    <option value="BDY2190">BDY2190</option>
                    <option value="SUPER2">SUPER2</option>
                </select>
            </div>

            <div class="form-group">
                <label for="selectDestino">Destino</label>
                <select id="selectDestino">
                    <option value="">Seleccionar destino</option>
                    <option value="CD JUTICALPA">CD JUTICALPA</option>
                    <option value="GERMANIA">GERMANÍA</option>
                    <option value="SABANA GRANDE">SABANA GRANDE</option>
                </select>
            </div>

            <button id="btnProgramar" class="btn-primary">+ PROGRAMAR UNIDAD</button>
        </section>

        <!-- Sección de Unidades Programadas -->
        <section class="card">
            <h2>📄 Unidades programadas</h2>
            <div id="listaUnidades">
                <div class="unidad-item">
                    <div class="unidad-header">
                        <span class="placa-text">🚚 TCA2222</span>
                        <span class="badge-en-ruta">En ruta</span>
                    </div>
                    <p><strong>Destino:</strong> CD JUTICALPA</p>
                    <p><strong>Ubicado en:</strong> Sin actualización</p>
                    <p><strong>Hora:</strong> Sin actualización</p>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
