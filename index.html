<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Seguimiento de Unidades</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:Arial,sans-serif;
}

.app{
  max-width:560px;
  margin:auto;
  padding:18px;
}

header{
  text-align:center;
  margin:10px 0 20px;
}

header .icon{
  font-size:42px;
}

h1{
  font-size:25px;
  margin:4px 0 6px;
}

header p{
  margin:0;
  color:#6b7280;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:700;
  font-size:17px;
  margin:10px 0 7px;
}

input,select{
  width:100%;
  padding:15px;
  border:1px solid #d1d5db;
  border-radius:11px;
  font-size:17px;
  background:white;
  color:#111827;
}

button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:15px;
  margin-top:16px;
  font-size:15px;
  font-weight:700;
  background:#111827;
  color:white;
}

.quick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.quick button{
  margin:0;
  background:#e5e7eb;
  color:#111827;
  padding:12px;
  font-size:13px;
}

.quick-title{
  font-weight:700;
  margin:16px 0 9px;
}

.secondary{
  width:auto;
  margin:0;
  padding:9px 13px;
  background:#e5e7eb;
  color:#111827;
  font-size:13px;
}

.danger{
  background:#fee2e2;
  color:#991b1b;
}

.hidden{
  display:none;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

h2{
  font-size:19px;
  margin:0 0 12px;
}

pre{
  white-space:pre-wrap;
  margin:0;
  font-family:Arial,sans-serif;
  font-size:15px;
  line-height:1.55;
}

.report{
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:11px;
  padding:12px;
  margin-top:10px;
}

.report button{
  margin-top:10px;
}

.empty{
  color:#6b7280;
  text-align:center;
  padding:12px;
}

.ok{
  margin-top:10px;
  text-align:center;
  color:#166534;
  font-weight:700;
}

  font-size:13px
