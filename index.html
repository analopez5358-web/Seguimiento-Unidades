<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Seguimiento de Unidades V5.3</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:Arial,sans-serif;
}

header{
  background:#111827;
  color:white;
  padding:24px 20px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;
  color:#d1d5db;
}

.container{
  max-width:650px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin:14px 0 7px;
}

input,
select{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  background:white;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}

.btn-primary{
  background:#2563eb;
  color:white;
}

.btn-success{
  background:#16a34a;
  color:white;
}

.btn-danger{
  background:#dc2626;
  color:white;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}

.btn-add{
  background:#111827;
  color:white;
}

.placa-row{
  display:flex;
  gap:8px;
  align-items:stretch;
}

.placa-row select{
  flex:1;
}

.placa-row button{
  width:auto;
  margin-top:0;
  white-space:nowrap;
  padding:12px 15px;
}

.unit{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:16px;
  margin-top:14px;
}

.unit-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.unit-header h3{
  margin:0;
  font-size:21px;
}

.badge{
  padding:7px 10px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  background:#dcfce7;
  color:#166534;
}

.info{
  margin-top:12px;
  line-height:1.7;
}

.info strong{
  color:#374151;
}

.unit-buttons{
  display:flex;
  gap:8px;
}

.unit-buttons button{
  flex:1;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:25px 10px;
}

.report{
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
  white-space:pre-line;
  line-height:1.6;
}

.small{
  color:#6b7280;
  font-size:13px;
  margin-top:7px;
}

.placas-lista{
  margin-top:12px;
}

.placa-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 12px;
  background:#f9fafb;
  border-radius:10px;
  margin-top:8px;
  font-weight:bold;
}

.placa-item button{
  width:auto;
  margin:0;
  padding:8px 12px;
  font-size:13px;
}

footer{
  text-align:center;
  color:#6b7280;
  padding:25px;
  font-size:13px;
}

@media(max-width:500px){

  .container{
    padding:12px;
  }

  header h1{
    font-size:24px;
  }

  .unit-buttons{
    flex-direction:column;
  }

  .placa-row button{
    font-size:14px;
  }

}

</style>
</head>

<body>


<header>

  <h1>
    Seguimiento de Unidades
  </h1>

  <p>
    Control y monitoreo de unidades
  </p>

</header>


<div class="container">


<!-- =================================
     REGISTRAR UNIDAD
================================= -->

<div class="card">

  <h2>
    Agregar unidad
  </h2>


  <label>
    Unidad / Placa
  </label>


  <div class="placa-row">

    <select id="unidad">

      <option value="">
        Seleccionar placa
      </option>

    </select>


    <button
      class="btn-add"
      onclick="agregarPlaca()">

      ＋ Agregar placa

    </button>

  </div>


  <label>
    Ubicado en
  </label>


  <input
    id="ubicacion"
    type="text"
    placeholder="Ej. El Nance"
    autocomplete="off"
  >


  <label>
    Destino
  </label>


  <select id="destino">

    <option value="">
      Seleccionar destino
    </option>

    <option value="CD JUTICALPA">
      CD JUTICALPA
    </option>

    <option value="CD SPS">
      CD SPS
    </option>

    <option value="CD COMAYAGUA">
      CD COMAYAGUA
    </option>

  </select>


  <label>
    Estado
  </label>


  <select id="estado">

    <option value="En ruta">
      En ruta
    </option>

    <option value="Detenida">
      Detenida
    </option>

    <option value="Ubicado en">
      Ubicado en
    </option>

    <option value="Llegó al CD JUTICALPA">
      Llegó al CD JUTICALPA
    </option>

    <option value="Llegó al CD SPS">
      Llegó al CD SPS
    </option>

    <option value="Llegó al CD COMAYAGUA">
      Llegó al CD COMAYAGUA
    </option>

    <option value="Finalizada">
      Finalizada
    </option>

  </select>


  <button
    class="btn-primary"
    onclick="agregarUnidad()">

    + Agregar unidad

  </button>


  <div class="small">

    La hora se registra automáticamente.

  </div>

</div>



<!-- =================================
     UNIDADES
================================= -->

<div class="card">

  <h2>
    Unidades
  </h2>


  <div id="listaUnidades">

    <div class="empty">
      No hay unidades registradas.
    </div>

  </div>

</div>



<!-- =================================
     REPORTE
================================= -->

<div class="card">

  <h2>
    Reporte
  </h2>


  <div
    id="reporte"
    class="report">

    Aún no hay información para generar el reporte.

  </div>


  <button
    class="btn-success"
    onclick="copiarReporte()">

    📲 Copiar reporte

  </button>


  <button
    class="btn-secondary"
    onclick="limpiarUnidades()">

    Limpiar unidades

  </button>

</div>



<!-- =================================
     PLACAS GUARDADAS
================================= -->

<div class="card">

  <h2>
    Placas guardadas
  </h2>


  <div
    id="listaPlacas"
    class="placas-lista">

  </div>

</div>


</div>


<footer>

  Seguimiento de Unidades V5.3

</footer>



<script>


/* =================================
   CLAVES DE ALMACENAMIENTO
================================= */

const CLAVE_PLACAS =
  "placasSeguimientoV53";


const CLAVE_UNIDADES =
  "seguimientoUnidadesV53";



/* =================================
   PLACAS INICIALES
================================= */

let placas =
  JSON.parse(
    localStorage.getItem(
      CLAVE_PLACAS
    )
  );


/*
   Si es la primera vez que se abre
   esta versión, se crean las dos
   placas que ya teníamos.
*/

if(
  !Array.isArray(placas) ||
  placas.length === 0
){

  placas = [
    "TCA2222",
    "TEA9111"
  ];

  guardarPlacas();

}



/* =================================
   UNIDADES DEL REPORTE
================================= */

let unidades =
  JSON.parse(
    localStorage.getItem(
      CLAVE_UNIDADES
    )
  );


if(
  !Array.isArray(unidades)
){

  unidades = [];

}



/* =================================
   GUARDAR PLACAS
================================= */

function guardarPlacas(){

  localStorage.setItem(
    CLAVE_PLACAS,
    JSON.stringify(placas)
  );

}



/* =================================
   GUARDAR UNIDADES
================================= */

function guardarUnidades(){

  localStorage.setItem(
    CLAVE_UNIDADES,
    JSON.stringify(unidades)
  );

}



/* =================================
   MOSTRAR PLACAS EN SELECTOR
================================= */

function mostrarPlacas(){

  const selector =
    document.getElementById(
      "unidad"
    );


  selector.innerHTML =
    "";


  const primeraOpcion =
    document.createElement(
      "option"
    );


  primeraOpcion.value =
    "";


  primeraOpcion.textContent =
    "Seleccionar placa";


  selector.appendChild(
    primeraOpcion
  );


  placas.forEach(

    function(placa){

      const opcion =
        document.createElement(
          "option"
        );


      opcion.value =
        placa;


      opcion.textContent =
        placa;


      selector.appendChild(
        opcion
      );

    }

  );


  mostrarListaPlacas();

}



/* =================================
   AGREGAR NUEVA PLACA
================================= */

function agregarPlaca(){

  const nuevaPlaca =
    prompt(
      "Escribe la nueva placa:"
    );


  if(
    nuevaPlaca === null
  ){

    return;

  }


  const placa =
    nuevaPlaca
      .trim()
      .toUpperCase();


  if(
    placa === ""
  ){

    alert(
      "Debes escribir una placa."
    );

    return;

  }


  if(
    placas.includes(
      placa
    )
  ){

    alert(
      "Esa placa ya está registrada."
    );

    return;

  }


  placas.push(
    placa
  );


  placas.sort();


  guardarPlacas();


  mostrarPlacas();


  /*
     Seleccionar automáticamente
     la nueva placa.
  */

  document.getElementById(
    "unidad"
  ).value =
    placa;


  alert(
    "Placa " +
    placa +
    " agregada correctamente."
  );

}



/* =================================
   MOSTRAR LISTA DE PLACAS
================================= */

function mostrarListaPlacas(){

  const contenedor =
    document.getElementById(
      "listaPlacas"
    );


  if(
    placas.length === 0
  ){

    contenedor.innerHTML =
      `
      <div class="empty">
        No hay placas guardadas.
      </div>
      `;

    return;

  }


  contenedor.innerHTML =
    "";


  placas.forEach(

    function(placa,index){

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "placa-item";


      div.innerHTML =

      `
        <span>
          🚛 ${placa}
        </span>

        <button
          class="btn-danger"
          onclick="eliminarPlaca(${index})">

          Eliminar

        </button>
      `;


      contenedor.appendChild(
        div
      );

    }

  );

}



/* =================================
   ELIMINAR PLACA
================================= */

function eliminarPlaca(index){

  const placa =
    placas[index];


  /*
     Evitar eliminar una placa
     que actualmente está siendo
     utilizada en el reporte.
  */

  const estaEnUso =
    unidades.some(

      function(unidad){

        return
          unidad.unidad === placa;

      }

    );


  if(
    estaEnUso
  ){

    alert(
      "No puedes eliminar esta placa porque está en el reporte actual."
    );

    return;

  }


  if(
    !confirm(
      "¿Quieres eliminar la placa " +
      placa +
      "?"
    )
  ){

    return;

  }


  placas.splice(
    index,
    1
  );


  guardarPlacas();


  mostrarPlacas();

}



/* =================================
   HORA ACTUAL
================================= */

function obtenerHora(){

  const ahora =
    new Date();


  return ahora.toLocaleTimeString(

    "es-HN",

    {
      hour:"2-digit",
      minute:"2-digit",
      hour12:true
    }

  );

}



/* =================================
   AGREGAR UNIDAD AL REPORTE
================================= */

function agregarUnidad(){

  const unidad =
    document.getElementById(
      "unidad"
    ).value;


  const ubicacion =
    document.getElementById(
      "ubicacion"
    ).value.trim();


  const destino =
    document.getElementById(
      "destino"
    ).value;


  const estado =
    document.getElementById(
      "estado"
    ).value;


  if(
    unidad === ""
  ){

    alert(
      "Selecciona una placa."
    );

    return;

  }


  if(
    ubicacion === ""
  ){

    alert(
      "Escribe dónde está ubicada la unidad."
    );

    return;

  }


  if(
    destino === ""
  ){

    alert(
      "Selecciona el destino."
    );

    return;

  }


  /*
     No permitir la misma placa
     dos veces en el reporte.
  */

  const existe =
    unidades.some(

      function(item){

        return
          item.unidad === unidad;

      }

    );


  if(
    existe
  ){

    alert(
      "Esta unidad ya está en el reporte actual."
    );

    return;

  }


  const nuevaUnidad = {

    unidad:
      unidad,

    ubicacion:
      ubicacion,

    destino:
      destino,

    estado:
      estado,

    hora:
      obtenerHora()

  };


  unidades.push(
    nuevaUnidad
  );


  guardarUnidades();


  mostrarUnidades();


  limpiarFormulario();

}



/* =================================
   MOSTRAR UNIDADES
================================= */

function mostrarUnidades(){

  const contenedor =
    document.getElementById(
      "listaUnidades"
    );


  if(
    unidades.length === 0
  ){

    contenedor.innerHTML =
      `
      <div class="empty">
        No hay unidades registradas.
      </div>
      `;

    generarReporte();

    return;

  }


  contenedor.innerHTML =
    "";


  unidades.forEach(

    function(unidad,index){

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "unit";


      div.innerHTML =

      `
      <div class="unit-header">

        <h3>
          🚛 ${unidad.unidad}
        </h3>

        <span class="badge">
          ${unidad.estado}
        </span>

      </div>


      <div class="info">

        📍 <strong>Ubicado en:</strong>
        ${unidad.ubicacion}

        <br>

        🎯 <strong>Destino:</strong>
        ${unidad.destino}

        <br>

        🕐 <strong>Hora:</strong>
        ${unidad.hora}

      </div>


      <div class="unit-buttons">

        <button
          class="btn-primary"
          onclick="cambiarEstado(${index})">

          Cambiar estado

        </button>


        <button
          class="btn-danger"
          onclick="eliminarUnidad(${index})">

          Eliminar

        </button>

      </div>
      `;


      contenedor.appendChild(
        div
      );

    }

  );


  generarReporte();

}



/* =================================
   CAMBIAR ESTADO
================================= */

function cambiarEstado(index){

  const estados = [

    "En ruta",

    "Detenida",

    "Ubicado en",

    "Llegó al CD JUTICALPA",

    "Llegó al CD SPS",

    "Llegó al CD COMAYAGUA",

    "Finalizada"

  ];


  let mensaje =
    "Selecciona el nuevo estado:\n\n";


  estados.forEach(

    function(estado,i){

      mensaje +=
        (i + 1) +
        ". " +
        estado +
        "\n";

    }

  );


  const opcion =
    prompt(
      mensaje
    );


  if(
    opcion === null
  ){

    return;

  }


  const numero =
    parseInt(
      opcion
    );


  if(
    isNaN(numero) ||
    numero < 1 ||
    numero > estados.length
  ){

    alert(
      "Opción no válida."
    );

    return;

  }


  unidades[index].estado =
    estados[
      numero - 1
    ];


  unidades[index].hora =
    obtenerHora();


  guardarUnidades();


  mostrarUnidades();

}



/* =================================
   ELIMINAR UNIDAD
================================= */

function eliminarUnidad(index){

  if(
    !confirm(
      "¿Deseas eliminar esta unidad del reporte?"
    )
  ){

    return;

  }


  unidades.splice(
    index,
    1
  );


  guardarUnidades();


  mostrarUnidades();

}



/* =================================
   GENERAR REPORTE
================================= */

function generarReporte(){

  const caja =
    document.getElementById(
      "reporte"
    );


  if(
    unidades.length === 0
  ){

    caja.textContent =
      "Aún no hay información para generar el reporte.";

    return;

  }


  /*
     FORMATO OFICIAL:

     📋 REPORTE DE SEGUIMIENTO

     🚛 TCA2222
     📍 Ubicado en: El Nance
     🎯 Destino: CD JUTICALPA
     🕐 Hora: 02:01 a. m.
  */


  let texto =
    "📋 REPORTE DE SEGUIMIENTO\n\n";


  unidades.forEach(

    function(unidad,index){

      texto +=
        "🚛 " +
        unidad.unidad +
        "\n";


      texto +=
        "📍 Ubicado en: " +
        unidad.ubicacion +
        "\n";


      texto +=
        "🎯 Destino: " +
        unidad.destino +
        "\n";


      texto +=
        "🕐 Hora: " +
        unidad.hora +
        "\n";


      if(
        index <
        unidades.length - 1
      ){

        texto +=
          "\n";

      }

    }

  );


  caja.textContent =
    texto;

}



/* =================================
   COPIAR REPORTE
================================= */

function copiarReporte(){

  generarReporte();


  const texto =
    document.getElementById(
      "reporte"
    ).textContent;


  if(
    texto.includes(
      "Aún no hay"
    )
  ){

    alert(
      "No hay unidades en el reporte."
    );

    return;

  }


  navigator.clipboard
    .writeText(
      texto
    )

    .then(

      function(){

        alert(
          "Reporte copiado correctamente."
        );

      }

    )

    .catch(

      function(){

        alert(
          "No se pudo copiar automáticamente."
        );

      }

    );

}



/* =================================
   LIMPIAR FORMULARIO
================================= */

function limpiarFormulario(){

  document.getElementById(
    "unidad"
  ).value =
    "";


  document.getElementById(
    "ubicacion"
  ).value =
    "";


  document.getElementById(
    "destino"
  ).value =
    "";


  document.getElementById(
    "estado"
  ).value =
    "En ruta";

}



/* =================================
   LIMPIAR REPORTE
================================= */

function limpiarUnidades(){

  if(
    unidades.length === 0
  ){

    return;

  }


  if(
    !confirm(
      "¿Seguro que deseas eliminar todas las unidades del reporte?"
    )
  ){

    return;

  }


  unidades =
    [];


  guardarUnidades();


  mostrarUnidades();

}



/* =================================
   INICIAR APP
================================= */

mostrarPlacas();

mostrarUnidades();

</script>

</body>
</html>
