<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Seguimiento de Unidades V6.1</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:Arial,sans-serif;
}

header{
  background:#111827;
  color:white;
  padding:24px 20px;
}

header h1{
  margin:0;
  font-size:27px;
}

header p{
  margin:7px 0 0;
  color:#d1d5db;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin:13px 0 7px;
}

input,select{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  background:white;
}

button{
  border:0;
  border-radius:10px;
  padding:14px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#2563eb;
  color:white;
  width:100%;
  margin-top:14px;
}

.green{
  background:#16a34a;
  color:white;
}

.gray{
  background:#e5e7eb;
  color:#111827;
}

.red{
  background:#dc2626;
  color:white;
}

.unit{
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:15px;
  margin-top:12px;
}

.unit-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.unit-head h3{
  margin:0;
  font-size:21px;
}

.badge{
  background:#dcfce7;
  color:#166534;
  border-radius:20px;
  padding:6px 10px;
  font-size:12px;
  font-weight:bold;
}

.info{
  margin-top:10px;
  line-height:1.7;
}

.update{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-top:12px;
}

.update button{
  background:#2563eb;
  color:white;
  width:100%;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.actions button{
  width:100%;
}

.report{
  background:#f9fafb;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:15px;
  white-space:pre-line;
  line-height:1.65;
  font-size:15px;
  min-height:80px;
}

.copy{
  width:100%;
  margin-top:12px;
  background:#16a34a;
  color:white;
}

.clear{
  width:100%;
  margin-top:9px;
  background:#e5e7eb;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:20px;
}

.small{
  color:#6b7280;
  font-size:13px;
}

footer{
  text-align:center;
  color:#6b7280;
  padding:25px;
}

@media(max-width:500px){
  .actions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>Seguimiento de Unidades</h1>
  <p>Programación y actualización de unidades</p>
</header>

<div class="container">

<!-- PROGRAMAR -->

<div class="card">

<h2>🚛 Programar unidad</h2>

<p class="small">
Programa la placa y el destino una sola vez.
Después solo actualiza la ubicación.
</p>

<label>Placa</label>

<input
 id="placa"
 type="text"
 placeholder="Ej. TCA2222"
 autocomplete="off">

<label>Destino</label>

<select id="destino">

<option value="">Seleccionar destino</option>
<option value="CD JUTICALPA">CD JUTICALPA</option>
<option value="CD SPS">CD SPS</option>
<option value="CD COMAYAGUA">CD COMAYAGUA</option>

</select>

<button
 class="primary"
 onclick="agregarUnidad()">

＋ PROGRAMAR UNIDAD

</button>

</div>


<!-- UNIDADES -->

<div class="card">

<h2>📋 Unidades programadas</h2>

<div id="unidades"></div>

</div>


<!-- REPORTE -->

<div class="card">

<h2>📄 Reporte</h2>

<div id="reporte" class="report">
Aún no hay unidades actualizadas.
</div>

<button
 class="copy"
 onclick="copiarReporte()">

📲 COPIAR REPORTE

</button>

<button
 class="clear"
 onclick="limpiarActualizaciones()">

Limpiar actualizaciones

</button>

</div>


<!-- FINALIZADAS -->

<div class="card">

<h2>✅ Unidades finalizadas</h2>

<div id="finalizadas"></div>

</div>

</div>

<footer>
Seguimiento de Unidades V6.1
</footer>


<script>

/* =====================================
   CLAVE DE ALMACENAMIENTO
===================================== */

const STORAGE =
"seguimiento_unidades_v61";

const STORAGE_OLD =
"unidadesProgramadasV6";


/* =====================================
   CARGAR
===================================== */

let unidades =
JSON.parse(
localStorage.getItem(STORAGE)
|| localStorage.getItem(STORAGE_OLD)
|| "null"
);


/* =====================================
   SI NO EXISTEN, CREAR LAS DOS
===================================== */

if(!Array.isArray(unidades)){

 unidades=[

  {
   placa:"TCA2222",
   destino:"CD JUTICALPA",
   ubicacion:"",
   hora:"",
   estado:"En ruta"
  },

  {
   placa:"TEA9111",
   destino:"CD COMAYAGUA",
   ubicacion:"",
   hora:"",
   estado:"En ruta"
  }

 ];

 guardar();

}


/* =====================================
   FINALIZADAS
===================================== */

let finalizadas =
JSON.parse(
localStorage.getItem(
"seguimiento_finalizadas_v61"
) || "[]"
);


/* =====================================
   GUARDAR
===================================== */

function guardar(){

 localStorage.setItem(
 STORAGE,
 JSON.stringify(unidades)
 );

 localStorage.setItem(
 "seguimiento_finalizadas_v61",
 JSON.stringify(finalizadas)
 );

}


/* =====================================
   HORA ACTUAL
===================================== */

function horaActual(){

 const ahora=new Date();

 return ahora.toLocaleTimeString(
 "es-HN",
 {
  hour:"2-digit",
  minute:"2-digit",
  hour12:true
 }
 );

}


/* =====================================
   AGREGAR
===================================== */

function agregarUnidad(){

 const placa=document
 .getElementById("placa")
 .value
 .trim()
 .toUpperCase();

 const destino=document
 .getElementById("destino")
 .value;


 if(!placa){

  alert("Escribe la placa.");

  return;

 }


 if(!destino){

  alert("Selecciona el destino.");

  return;

 }


 const existe=unidades.some(
 u=>u.placa===placa
 );


 if(existe){

  alert(
   "La placa "+placa+
   " ya está programada."
  );

  return;

 }


 unidades.push({

  placa:placa,
  destino:destino,
  ubicacion:"",
  hora:"",
  estado:"En ruta"

 });


 guardar();

 document.getElementById("placa")
 .value="";

 document.getElementById("destino")
 .value="";

 mostrar();

 alert(
  "Unidad "+placa+
  " programada correctamente."
 );

}


/* =====================================
   ACTUALIZAR
===================================== */

function actualizar(i){

 const campo=document
 .getElementById(
 "ubicacion_"+i
 );

 const ubicacion=campo
 .value
 .trim();


 if(!ubicacion){

  alert(
   "Escribe la ubicación."
  );

  return;

 }


 unidades[i].ubicacion=
 ubicacion;

 unidades[i].hora=
 horaActual();

 /*
  La placa y destino NO cambian.
 */

 guardar();

 mostrar();

 generarReporte();

 /*
  Llevar automáticamente
  al reporte.
 */

 setTimeout(function(){

  document
  .getElementById("reporte")
  .scrollIntoView({
   behavior:"smooth",
   block:"center"
  });

 },100);

}


/* =====================================
   CAMBIAR ESTADO
===================================== */

function cambiarEstado(i){

 const opciones=[
  "En ruta",
  "Detenida",
  "Llegó al CD JUTICALPA",
  "Llegó al CD SPS",
  "Llegó al CD COMAYAGUA"
 ];

 let texto=
 "Selecciona el estado:\n\n";

 opciones.forEach(
 function(x,n){

  texto+=
  (n+1)+". "+x+"\n";

 });


 const respuesta=
 prompt(texto);


 if(respuesta===null)return;


 const numero=parseInt(
 respuesta
 );


 if(
 isNaN(numero) ||
 numero<1 ||
 numero>opciones.length
 ){

  alert("Opción inválida.");

  return;

 }


 unidades[i].estado=
 opciones[numero-1];

 unidades[i].hora=
 horaActual();

 guardar();

 mostrar();

 generarReporte();

}


/* =====================================
   CAMBIAR DESTINO
===================================== */

function cambiarDestino(i){

 const nuevo=prompt(
 "Escribe el nuevo destino:\n\n"+
 "CD JUTICALPA\n"+
 "CD SPS\n"+
 "CD COMAYAGUA"
 );


 if(nuevo===null)return;


 const destino=
 nuevo.trim().toUpperCase();


 if(
 destino!=="CD JUTICALPA" &&
 destino!=="CD SPS" &&
 destino!=="CD COMAYAGUA"
 ){

  alert("Destino no válido.");

  return;

 }


 unidades[i].destino=
 destino;

 guardar();

 mostrar();

 generarReporte();

}


/* =====================================
   FINALIZAR
===================================== */

function finalizar(i){

 const unidad=unidades[i];


 if(!confirm(
 "¿Finalizar la unidad "+
 unidad.placa+"?"
 ))return;


 unidad.estado=
 "Finalizada";

 unidad.hora=
 horaActual();


 finalizadas.push(unidad);

 unidades.splice(i,1);

 guardar();

 mostrar();

 generarReporte();

}


/* =====================================
   ELIMINAR
===================================== */

function eliminar(i){

 const unidad=unidades[i];


 if(!confirm(
 "¿Eliminar la unidad "+
 unidad.placa+"?"
 ))return;


 unidades.splice(i,1);

 guardar();

 mostrar();

 generarReporte();

}


/* =====================================
   MOSTRAR UNIDADES
===================================== */

function mostrar(){

 const contenedor=
 document.getElementById(
 "unidades"
 );


 if(unidades.length===0){

  contenedor.innerHTML=
  `
  <div class="empty">
  No hay unidades programadas.
  </div>
  `;

 }else{

  contenedor.innerHTML="";


  unidades.forEach(
  function(u,i){

   const div=
   document.createElement("div");

   div.className="unit";


   div.innerHTML=`

   <div class="unit-head">

    <h3>🚛 ${u.placa}</h3>

    <span class="badge">
    ${u.estado}
    </span>

   </div>


   <div class="info">

   🎯 <strong>Destino:</strong>
   ${u.destino}

   <br>

   📍 <strong>Ubicado en:</strong>
   ${u.ubicacion || "Sin actualización"}

   <br>

   🕐 <strong>Hora:</strong>
   ${u.hora || "Sin actualización"}

   </div>


   <div class="update">

    <input
     id="ubicacion_${i}"
     type="text"
     placeholder="Nueva ubicación">

    <button
     onclick="actualizar(${i})">

     🔄 Actualizar

    </button>

   </div>


   <div class="actions">

    <button
     class="gray"
     onclick="cambiarEstado(${i})">

     Estado

    </button>


    <button
     class="gray"
     onclick="cambiarDestino(${i})">

     Destino

    </button>


    <button
     class="green"
     onclick="finalizar(${i})">

     Finalizar

    </button>


    <button
     class="red"
     onclick="eliminar(${i})">

     Eliminar

    </button>

   </div>

   `;


   contenedor.appendChild(div);

  });

 }


 mostrarFinalizadas();

 generarReporte();

}


/* =====================================
   GENERAR REPORTE
===================================== */

function generarReporte(){

 const reporte=
 document.getElementById(
 "reporte"
 );


 const actualizadas=
 unidades.filter(
 u=>u.ubicacion &&
 u.hora
 );


 if(actualizadas.length===0){

  reporte.textContent=
  "Aún no hay unidades actualizadas.";

  return;

 }


 let texto=
 "📋 REPORTE DE SEGUIMIENTO\n\n";


 actualizadas.forEach(
 function(u,i){

  texto+=
  "🚛 "+u.placa+"\n";

  texto+=
  "📍 Ubicado en: "+
  u.ubicacion+"\n";

  texto+=
  "🎯 Destino: "+
  u.destino+"\n";

  texto+=
  "🕐 Hora: "+
  u.hora+"\n";


  /*
   Solo mostramos estado si
   no es simplemente En ruta.
  */

  if(
   u.estado &&
   u.estado!=="En ruta"
  ){

   texto+=
   "📌 Estado: "+
   u.estado+"\n";

  }


  if(
   i<actualizadas.length-1
  ){

   texto+=
   "\n━━━━━━━━━━━━━━━━━━━━\n\n";

  }

 });


 reporte.textContent=
 texto;

}


/* =====================================
   COPIAR REPORTE
===================================== */

function copiarReporte(){

 generarReporte();


 const texto=
 document.getElementById(
 "reporte"
 ).textContent;


 if(
 texto===
 "Aún no hay unidades actualizadas."
 ){

  alert(
   "Primero actualiza una unidad."
  );

  return;

 }


 /*
  Método moderno
 */

 if(
 navigator.clipboard &&
 navigator.clipboard.writeText
 ){

  navigator.clipboard
  .writeText(texto)
  .then(
   function(){

    alert(
     "✅ Reporte copiado."
    );

   }
  )
  .catch(
   function(){

    copiarAlternativo(texto);

   }
  );

 }else{

  copiarAlternativo(texto);

 }

}


/* =====================================
   COPIADO ALTERNATIVO
===================================== */

function copiarAlternativo(texto){

 const area=
 document.createElement(
 "textarea"
 );

 area.value=texto;

 area.style.position=
 "fixed";

 area.style.left=
 "-9999px";

 document.body.appendChild(area);

 area.select();

 try{

  document.execCommand(
   "copy"
  );

  alert(
   "✅ Reporte copiado."
  );

 }catch(e){

  alert(
   "No se pudo copiar automáticamente. "+
   "Mantén presionado el texto para copiarlo."
  );

 }

 document.body.removeChild(
  area
 );

}


/* =====================================
   LIMPIAR ACTUALIZACIONES
===================================== */

function limpiarActualizaciones(){

 if(unidades.length===0)return;


 if(!confirm(
 "¿Limpiar ubicación y hora de todas las unidades?"
 ))return;


 unidades.forEach(
 function(u){

  u.ubicacion="";
  u.hora="";

 });


 guardar();

 mostrar();

}


/* =====================================
   FINALIZADAS
===================================== */

function mostrarFinalizadas(){

 const contenedor=
 document.getElementById(
 "finalizadas"
 );


 if(finalizadas.length===0){

  contenedor.innerHTML=
  `
  <div class="empty">
  No hay unidades finalizadas.
  </div>
  `;

  return;

 }


 contenedor.innerHTML="";


 finalizadas.forEach(
 function(u){

  const div=
  document.createElement("div");

  div.className="unit";


  div.innerHTML=`

  <div class="unit-head">

   <h3>🚛 ${u.placa}</h3>

   <span class="badge">
   Finalizada
   </span>

  </div>

  <div class="info">

  🎯 <strong>Destino:</strong>
  ${u.destino}

  <br>

  📍 <strong>Ubicado en:</strong>
  ${u.ubicacion || "Sin ubicación"}

  <br>

  🕐 <strong>Hora:</strong>
  ${u.hora || "Sin hora"}

  </div>

  `;


  contenedor.appendChild(div);

 });

}


/* =====================================
   INICIAR
===================================== */

mostrar();

</script>

</body>
</html>
