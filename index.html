<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Seguimiento de Unidades V6.2</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:Arial,sans-serif;
}

header{
  background:#111827;
  color:white;
  padding:24px 20px;
}

header h1{
  margin:0;
  font-size:27px;
}

header p{
  margin:7px 0 0;
  color:#d1d5db;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin:13px 0 7px;
}

input,select{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  background:white;
}

button{
  border:0;
  border-radius:10px;
  padding:14px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#2563eb;
  color:white;
  width:100%;
  margin-top:14px;
}

.green{
  background:#16a34a;
  color:white;
}

.red{
  background:#dc2626;
  color:white;
}

.gray{
  background:#e5e7eb;
  color:#111827;
}

.unit{
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:15px;
  margin-top:12px;
}

.unit-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.unit-head h3{
  margin:0;
  font-size:21px;
}

.badge{
  background:#dcfce7;
  color:#166534;
  border-radius:20px;
  padding:6px 10px;
  font-size:12px;
  font-weight:bold;
}

.info{
  margin-top:10px;
  line-height:1.7;
}

.update{
  margin-top:12px;
}

.update input{
  margin-bottom:8px;
}

.update button{
  width:100%;
  background:#2563eb;
  color:white;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.actions button{
  width:100%;
}

.report{
  background:#f9fafb;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:15px;
  white-space:pre-line;
  line-height:1.65;
  font-size:15px;
  min-height:80px;
}

.copy{
  width:100%;
  margin-top:12px;
  background:#16a34a;
  color:white;
}

.clear{
  width:100%;
  margin-top:9px;
  background:#e5e7eb;
  color:#111827;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:20px;
}

.small{
  color:#6b7280;
  font-size:13px;
}

.newPlate{
  display:none;
  margin-top:10px;
}

footer{
  text-align:center;
  color:#6b7280;
  padding:25px;
}

@media(max-width:500px){
  .actions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>Seguimiento de Unidades</h1>
  <p>Programación y actualización de unidades</p>
</header>

<div class="container">

<!-- PROGRAMAR UNIDAD -->

<div class="card">

<h2>🚛 Programar unidad</h2>

<p class="small">
Selecciona una placa y su destino. Después solo tendrás que actualizar la ubicación.
</p>

<label>Placa</label>

<select id="placaSelect" onchange="seleccionarPlaca()">
  <option value="">Seleccionar placa</option>
</select>

<div id="newPlateBox" class="newPlate">

<input
 id="nuevaPlaca"
 type="text"
 placeholder="Escribe la nueva placa"
 autocomplete="off">

</div>

<label>Destino</label>

<select id="destino">
  <option value="">Seleccionar destino</option>
  <option value="CD JUTICALPA">CD JUTICALPA</option>
  <option value="CD SPS">CD SPS</option>
  <option value="CD COMAYAGUA">CD COMAYAGUA</option>
</select>

<button
 class="primary"
 onclick="agregarUnidad()">

＋ PROGRAMAR UNIDAD

</button>

</div>


<!-- UNIDADES -->

<div class="card">

<h2>📋 Unidades programadas</h2>

<div id="unidades"></div>

</div>


<!-- REPORTE -->

<div class="card">

<h2>📄 Reporte</h2>

<div id="reporte" class="report">
Aún no hay unidades actualizadas.
</div>

<button
 class="copy"
 onclick="copiarReporte()">

📲 COPIAR REPORTE

</button>

<button
 class="clear"
 onclick="limpiarActualizaciones()">

Limpiar actualizaciones

</button>

</div>


<!-- FINALIZADAS -->

<div class="card">

<h2>✅ Unidades finalizadas</h2>

<div id="finalizadas"></div>

</div>

</div>

<footer>
Seguimiento de Unidades V6.2
</footer>


<script>

/* =====================================
   ALMACENAMIENTO
===================================== */

const STORAGE="seguimiento_unidades_v62";

const OLD_STORAGE="seguimiento_unidades_v61";

const FINAL_STORAGE=
"seguimiento_finalizadas_v62";


/* =====================================
   CARGAR UNIDADES
===================================== */

let unidades=
JSON.parse(
localStorage.getItem(STORAGE)
|| localStorage.getItem(OLD_STORAGE)
|| "null"
);


/* =====================================
   SI ES UNA INSTALACIÓN NUEVA
===================================== */

if(!Array.isArray(unidades)){

  unidades=[
    {
      placa:"TCA2222",
      destino:"CD JUTICALPA",
      ubicacion:"",
      hora:"",
      estado:"En ruta"
    },
    {
      placa:"TEA9111",
      destino:"CD COMAYAGUA",
      ubicacion:"",
      hora:"",
      estado:"En ruta"
    },
    {
      placa:"HDV4065",
      destino:"CD SPS",
      ubicacion:"",
      hora:"",
      estado:"En ruta"
    }
  ];

}


/* =====================================
   MIGRAR DATOS ANTIGUOS
===================================== */

unidades=unidades.map(u=>({

  placa:u.placa || "",
  destino:u.destino || "",
  ubicacion:u.ubicacion || "",
  hora:u.hora || "",
  estado:u.estado || "En ruta"

}));


let finalizadas=
JSON.parse(
localStorage.getItem(FINAL_STORAGE)
|| "[]"
);


/* =====================================
   GUARDAR
===================================== */

function guardar(){

  localStorage.setItem(
    STORAGE,
    JSON.stringify(unidades)
  );

  localStorage.setItem(
    FINAL_STORAGE,
    JSON.stringify(finalizadas)
  );

}


/* =====================================
   LISTA DE PLACAS
===================================== */

function cargarListaPlacas(){

  const select=
  document.getElementById("placaSelect");

  select.innerHTML=
  `<option value="">Seleccionar placa</option>`;

  const placas=[
    "TCA2222",
    "TEA9111",
    "HDV4065"
  ];

  /*
   Agregar también cualquier placa
   nueva que ya haya sido guardada.
  */

  unidades.forEach(u=>{

    if(
      u.placa &&
      !placas.includes(u.placa)
    ){
      placas.push(u.placa);
    }

  });


  placas.forEach(placa=>{

    const option=
    document.createElement("option");

    option.value=placa;
    option.textContent=placa;

    select.appendChild(option);

  });


  const nueva=
  document.createElement("option");

  nueva.value="__NUEVA__";
  nueva.textContent="➕ Nueva placa...";

  select.appendChild(nueva);

}


/* =====================================
   SELECCIONAR PLACA
===================================== */

function seleccionarPlaca(){

  const valor=
  document.getElementById(
    "placaSelect"
  ).value;

  const caja=
  document.getElementById(
    "newPlateBox"
  );

  if(valor==="__NUEVA__"){

    caja.style.display="block";

  }else{

    caja.style.display="none";

    document.getElementById(
      "nuevaPlaca"
    ).value="";

  }

}


/* =====================================
   HORA
===================================== */

function horaActual(){

  return new Date().toLocaleTimeString(
    "es-HN",
    {
      hour:"2-digit",
      minute:"2-digit",
      hour12:true
    }
  );

}


/* =====================================
   PROGRAMAR UNIDAD
===================================== */

function agregarUnidad(){

  const select=
  document.getElementById(
    "placaSelect"
  );

  let placa=select.value;


  if(placa==="__NUEVA__"){

    placa=document
      .getElementById("nuevaPlaca")
      .value
      .trim()
      .toUpperCase();

  }


  const destino=
  document.getElementById(
    "destino"
  ).value;


  if(!placa){

    alert("Selecciona una placa.");

    return;

  }


  if(!destino){

    alert("Selecciona el destino.");

    return;

  }


  const existe=
  unidades.some(
    u=>u.placa===placa
  );


  if(existe){

    alert(
      "La placa "+placa+
      " ya está programada."
    );

    return;

  }


  unidades.push({

    placa:placa,
    destino:destino,
    ubicacion:"",
    hora:"",
    estado:"En ruta"

  });


  guardar();

  document.getElementById(
    "placaSelect"
  ).value="";

  document.getElementById(
    "destino"
  ).value="";

  document.getElementById(
    "nuevaPlaca"
  ).value="";

  document.getElementById(
    "newPlateBox"
  ).style.display="none";


  cargarListaPlacas();

  mostrar();


  alert(
    "✅ "+placa+
    " fue programada correctamente."
  );

}


/* =====================================
   ACTUALIZAR UBICACIÓN
===================================== */

function actualizar(i){

  const campo=
  document.getElementById(
    "ubicacion_"+i
  );

  const ubicacion=
  campo.value.trim();


  if(!ubicacion){

    alert(
      "Escribe la ubicación."
    );

    return;

  }


  /*
   SOLO cambia ubicación y hora.
   Placa y destino permanecen.
  */

  unidades[i].ubicacion=
    ubicacion;

  unidades[i].hora=
    horaActual();

  unidades[i].estado=
    "En ruta";


  guardar();

  mostrar();

  generarReporte();


  setTimeout(()=>{

    document
      .getElementById("reporte")
      .scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

  },100);

}


/* =====================================
   FINALIZAR
===================================== */

function finalizar(i){

  const unidad=
    unidades[i];


  if(!confirm(
    "¿Finalizar la unidad "+
    unidad.placa+"?"
  )) return;


  unidad.estado=
    "Finalizada";

  unidad.hora=
    horaActual();


  finalizadas.push(unidad);

  unidades.splice(i,1);


  guardar();

  cargarListaPlacas();

  mostrar();

  generarReporte();

}


/* =====================================
   ELIMINAR
===================================== */

function eliminar(i){

  const unidad=
    unidades[i];


  if(!confirm(
    "¿Eliminar la unidad "+
    unidad.placa+"?"
  )) return;


  unidades.splice(i,1);

  guardar();

  cargarListaPlacas();

  mostrar();

  generarReporte();

}


/* =====================================
   MOSTRAR UNIDADES
===================================== */

function mostrar(){

  const contenedor=
    document.getElementById(
      "unidades"
    );


  if(unidades.length===0){

    contenedor.innerHTML=
    `
      <div class="empty">
        No hay unidades programadas.
      </div>
    `;

  }else{

    contenedor.innerHTML="";


    unidades.forEach(
      function(u,i){

        const div=
          document.createElement("div");

        div.className="unit";


        div.innerHTML=`

          <div class="unit-head">

            <h3>🚛 ${u.placa}</h3>

            <span class="badge">
              ${u.estado}
            </span>

          </div>


          <div class="info">

            🎯 <strong>Destino:</strong>
            ${u.destino}

            <br>

            📍 <strong>Ubicado en:</strong>
            ${u.ubicacion || "Sin actualización"}

            <br>

            🕐 <strong>Hora:</strong>
            ${u.hora || "Sin actualización"}

          </div>


          <div class="update">

            <input
              id="ubicacion_${i}"
              type="text"
              placeholder="Nueva ubicación">

            <button
              onclick="actualizar(${i})">

              🔄 Actualizar

            </button>

          </div>


          <div class="actions">

            <button
              class="green"
              onclick="finalizar(${i})">

              Finalizar

            </button>

            <button
              class="red"
              onclick="eliminar(${i})">

              Eliminar

            </button>

          </div>

        `;


        contenedor.appendChild(div);

      }
    );

  }


  mostrarFinalizadas();

  generarReporte();

}


/* =====================================
   GENERAR REPORTE
===================================== */

function generarReporte(){

  const reporte=
    document.getElementById(
      "reporte"
    );


  const actualizadas=
    unidades.filter(
      u=>u.ubicacion && u.hora
    );


  if(actualizadas.length===0){

    reporte.textContent=
      "Aún no hay unidades actualizadas.";

    return;

  }


  let texto=
    "📋 REPORTE DE SEGUIMIENTO\n\n";


  actualizadas.forEach(
    function(u,i){

      texto+=
        "🚛 "+u.placa+"\n";

      texto+=
        "📍 Ubicado en: "+
        u.ubicacion+"\n";

      texto+=
        "🎯 Destino: "+
        u.destino+"\n";

      texto+=
        "🕐 Hora: "+
        u.hora+"\n";


      if(
        i<actualizadas.length-1
      ){

        texto+=
          "\n━━━━━━━━━━━━━━━━━━━━\n\n";

      }

    }
  );


  reporte.textContent=texto;

}


/* =====================================
   COPIAR REPORTE
===================================== */

function copiarReporte(){

  generarReporte();


  const texto=
    document.getElementById(
      "reporte"
    ).textContent;


  if(
    texto===
    "Aún no hay unidades actualizadas."
  ){

    alert(
      "Primero actualiza una unidad."
    );

    return;

  }


  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(texto)
      .then(()=>{

        alert(
          "✅ Reporte copiado."
        );

      })
      .catch(()=>{

        copiarAlternativo(texto);

      });

  }else{

    copiarAlternativo(texto);

  }

}


/* =====================================
   COPIADO ALTERNATIVO
===================================== */

function copiarAlternativo(texto){

  const area=
    document.createElement(
      "textarea"
    );

  area.value=texto;

  area.style.position="fixed";
  area.style.left="-9999px";

  document.body.appendChild(area);

  area.select();


  try{

    document.execCommand("copy");

    alert(
      "✅ Reporte copiado."
    );

  }catch(e){

    alert(
      "No se pudo copiar automáticamente."
    );

  }


  document.body.removeChild(area);

}


/* =====================================
   LIMPIAR ACTUALIZACIONES
===================================== */

function limpiarActualizaciones(){

  if(unidades.length===0)
    return;


  if(!confirm(
    "¿Limpiar ubicación y hora de todas las unidades?"
  )) return;


  unidades.forEach(u=>{

    u.ubicacion="";
    u.hora="";

  });


  guardar();

  mostrar();

}


/* =====================================
   FINALIZADAS
===================================== */

function mostrarFinalizadas(){

  const contenedor=
    document.getElementById(
      "finalizadas"
    );


  if(finalizadas.length===0){

    contenedor.innerHTML=
    `
      <div class="empty">
        No hay unidades finalizadas.
      </div>
    `;

    return;

  }


  contenedor.innerHTML="";


  finalizadas.forEach(u=>{

    const div=
      document.createElement("div");

    div.className="unit";


    div.innerHTML=`

      <div class="unit-head">

        <h3>🚛 ${u.placa}</h3>

        <span class="badge">
          Finalizada
        </span>

      </div>


      <div class="info">

        🎯 <strong>Destino:</strong>
        ${u.destino}

        <br>

        📍 <strong>Ubicado en:</strong>
        ${u.ubicacion || "Sin ubicación"}

        <br>

        🕐 <strong>Hora:</strong>
        ${u.hora || "Sin hora"}

      </div>

    `;


    contenedor.appendChild(div);

  });

}


/* =====================================
   INICIAR
===================================== */

guardar();

cargarListaPlacas();

mostrar();

</script>

</body>
</html>
