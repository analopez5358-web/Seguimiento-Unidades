<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seguimiento de Unidades V4</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:Arial,sans-serif;
}

.app{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:24px 16px 40px;
}

.header{
  text-align:center;
  margin-bottom:22px;
}

.icon{
  font-size:48px;
  margin-bottom:5px;
}

h1{
  margin:0;
  font-size:30px;
}

.subtitle{
  margin-top:8px;
  color:#6b7280;
  font-size:17px;
}

.card{
  background:white;
  border-radius:24px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.section-title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:18px;
}

label{
  display:block;
  font-size:18px;

  margin:16px 0 8px;
}

input,select{

  height:58px;
  border:1px solid #d1d5db;
  border-radius:16px;
  padding:0 16px;
  font-size:17px;
  background:white;
  color:#111827;
}

button{
  border:0;
  border-radius:16px;
  padding:16px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.add-btn{
  background:#e5e7eb;
  color:#111827;
  width:auto;
  float:right;
  margin-top:-8px;
}

.clear-btn{
  background:#fee2e2;
  color:#991b1b;
  float:right;
  margin-top:-8px;
  padding:12px 16px;
}

.quick-title{
  font-size:18px;
  font-weight:bold;
  margin-top:20px;
  margin-bottom:10px;
}

.quick-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.quick{
  min-height:68px;
  background:#e5e7eb;
  color:#111827;
}

.quick:active{
  transform:scale(.98);
}
