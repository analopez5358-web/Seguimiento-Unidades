<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Seguimiento de Unidades V6.2</title>

<style>
:root{color-scheme:dark;--bg:#080f1f;--panel:#111c31;--panel2:#17243b;--line:#263752;--text:#edf4ff;--muted:#91a3bd;--blue:#2583ff;--green:#19c78a;--red:#ff5d70}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 75% 0%,#14284a 0%,#080f1f 52%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
header{position:fixed;inset:0 auto 0 0;width:248px;background:linear-gradient(180deg,#101d33,#0b1425);border-right:1px solid var(--line);padding:30px 20px;z-index:5}
header:before{content:"◈";display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#2684ff,#4b5dff);font-size:27px;margin-bottom:24px;box-shadow:0 8px 25px #1674ff38}
header h1{font-size:21px;line-height:1.25;margin:0;letter-spacing:-.5px}
header p{font-size:12px;line-height:1.5;color:var(--muted);margin:9px 0 30px}
header:after{content:"▦  Inicio\A\A  ＋  Programar unidad\A\A  ◉  Unidades programadas\A\A  ▤  Reportes\A\A  ✓  Finalizadas";white-space:pre;display:block;color:#c5d2e6;font-size:13px;line-height:2.4;padding:18px 12px;border-top:1px solid var(--line)}
.container{max-width:1380px;margin:0 0 0 248px;padding:30px;display:grid;grid-template-columns:minmax(300px,.82fr) minmax(420px,1.35fr);gap:20px;align-items:start}
.card{min-width:0;background:linear-gradient(145deg,rgba(20,33,55,.97),rgba(13,24,42,.97));border:1px solid var(--line);border-radius:20px;padding:23px;margin-bottom:20px;box-shadow:0 15px 40px #0002}
.card:nth-child(1){grid-column:1;grid-row:1}
.card:nth-child(2){grid-column:2;grid-row:1 / span 2}
.card:nth-child(3){grid-column:1;grid-row:2}
.card:nth-child(4){grid-column:1 / -1;grid-row:3}
h2{margin:0 0 18px;font-size:20px;letter-spacing:-.3px}
h2:after{content:"";display:block;width:38px;height:3px;border-radius:3px;background:var(--blue);margin-top:11px}
label{display:block;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:#a8bad3;font-weight:750;margin:16px 0 8px}
input,select{width:100%;padding:14px 15px;border:1px solid #30425e;border-radius:12px;font-size:15px;background:#0b1527;color:var(--text);outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2583ff22}
input::placeholder{color:#6f829e}
button{border:1px solid transparent;border-radius:11px;padding:12px 15px;font-size:13px;font-weight:750;cursor:pointer;transition:transform .15s,filter .15s}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
.primary{background:linear-gradient(135deg,#318bff,#315de8);color:#fff;width:100%;margin-top:20px;box-shadow:0 7px 20px #267bff28}
.green{background:#103d38;color:#5df0bc;border-color:#1c6658}
.red{background:#421e2a;color:#ff9aaa;border-color:#703040}
.gray,.clear{background:#202f46;color:#c9d7ea;border-color:#30435e}
.unit{background:linear-gradient(145deg,#172740,#101c30);border:1px solid #2b3e5b;border-radius:16px;padding:18px;margin-top:13px;transition:border .2s,transform .2s}
.unit:hover{border-color:#3d6ba6;transform:translateY(-1px)}
.unit-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.unit-head h3{margin:0;font-size:21px;letter-spacing:.4px}
.badge{background:#103d38;color:#5df0bc;border:1px solid #1c6658;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.info{margin-top:14px;line-height:1.9;color:#c3d0e3;font-size:13px}
.info strong{color:#f2f6ff}
.update{margin-top:15px;display:flex;gap:8px}
.update input{min-width:0;flex:1;margin:0}
.update button{background:var(--blue);color:#fff;white-space:nowrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.actions button{width:100%}
.report{background:#0a1425;border:1px solid #2a3b57;border-radius:13px;padding:16px;white-space:pre-line;line-height:1.8;font-size:14px;min-height:100px;color:#dce8f8}
.copy{width:100%;margin-top:12px;background:linear-gradient(135deg,#13a878,#087e67);color:white}
.clear{width:100%;margin-top:9px}
.empty{text-align:center;color:var(--muted);padding:26px 15px;background:#0c1728;border:1px dashed #2a3b57;border-radius:13px;font-size:13px}
.small{color:var(--muted);font-size:13px;line-height:1.6}
.newPlate{display:none;margin-top:10px}
footer{grid-column:1/-1;text-align:center;color:#657995;padding:8px 20px 25px;font-size:12px}
@media(max-width:1050px){.container{grid-template-columns:1fr;margin-left:220px;padding:22px}.card:nth-child(n){grid-column:1;grid-row:auto}}
@media(max-width:700px){header{position:relative;width:auto;inset:auto;padding:20px 18px;border-right:0;border-bottom:1px solid var(--line)}header:before{float:left;margin:0 13px 10px 0;width:42px;height:42px}header h1{font-size:19px}header p{margin:5px 0 12px}header:after{display:none}.container{margin:0;padding:14px;display:block}.card{padding:18px;border-radius:16px}.unit-head h3{font-size:18px}.update{display:block}.update input{margin-bottom:8px}.update button{width:100%}.actions{grid-template-columns:1fr 1fr}}
</style>
</head>

<body>

<header>
  <h1>Seguimiento de Unidades</h1>
  <p>Programación y actualización de unidades</p>
</header>

<div class="container">

<!-- PROGRAMAR UNIDAD -->

<div class="card">

<h2>🚛 Programar unidad</h2>

<p class="small">
Selecciona una placa y su destino. Después solo tendrás que actualizar la ubicación.
</p>

<label>Placa</label>

<select id="placaSelect" onchange="seleccionarPlaca()">
  <option value="">Seleccionar placa</option>
</select>

<div id="newPlateBox" class="newPlate">

<input
 id="nuevaPlaca"
 type="text"
 placeholder="Escribe la nueva placa"
 autocomplete="off">

</div>

<label>Destino</label>

<select id="destino">
  <option value="">Seleccionar destino</option>
  <option value="CD JUTICALPA">CD JUTICALPA</option>
  <option value="CD SPS">CD SPS</option>
  <option value="CD COMAYAGUA">CD COMAYAGUA</option>
</select>

<button
 class="primary"
 onclick="agregarUnidad()">

＋ PROGRAMAR UNIDAD

</button>

</div>


<!-- UNIDADES -->

<div class="card">

<h2>📋 Unidades programadas</h2>

<div id="unidades"></div>

</div>


<!-- REPORTE -->

<div class="card">

<h2>📄 Reporte</h2>

<div id="reporte" class="report">
Aún no hay unidades actualizadas.
</div>

<button
 class="copy"
 onclick="copiarReporte()">

📲 COPIAR REPORTE

</button>

<button
 class="clear"
 onclick="limpiarActualizaciones()">

Limpiar actualizaciones

</button>

</div>


<!-- FINALIZADAS -->

<div class="card">

<h2>✅ Unidades finalizadas</h2>

<div id="finalizadas"></div>

</div>

</div>

<footer>
Seguimiento de Unidades V6.2
</footer>


<script>

/* =====================================
   ALMACENAMIENTO
===================================== */

const STORAGE="seguimiento_unidades_v62";

const OLD_STORAGE="seguimiento_unidades_v61";

const FINAL_STORAGE=
"seguimiento_finalizadas_v62";
  
  const API_URL=
"https://script.google.com/macros/s/AKfycbwxHNznuuE71sv5MZpwIN9dfjGLT0DZaiHi0Y_f9dOTjRiqO0XCJj5y-ScuKR-ZtZNv/exec";


/* =====================================
   CARGAR UNIDADES
===================================== */

let unidades=
JSON.parse(
localStorage.getItem(STORAGE)
|| localStorage.getItem(OLD_STORAGE)
|| "null"
);


/* =====================================
   SI ES UNA INSTALACIÓN NUEVA
===================================== */

if(!Array.isArray(unidades)){

  unidades=[
    {
      placa:"TCA2222",
      destino:"CD JUTICALPA",
      ubicacion:"",
      hora:"",
      estado:"En ruta"
    },
    {
      placa:"TEA9111",
      destino:"CD COMAYAGUA",
      ubicacion:"",
      hora:"",
      estado:"En ruta"
    },
    {
      placa:"HDV4065",
      destino:"CD SPS",
      ubicacion:"",
      hora:"",
      estado:"En ruta"
    }
  ];

}


/* =====================================
   MIGRAR DATOS ANTIGUOS
===================================== */

unidades=unidades.map(u=>({

  placa:u.placa || "",
  destino:u.destino || "",
  ubicacion:u.ubicacion || "",
  hora:u.hora || "",
  estado:u.estado || "En ruta"

}));


let finalizadas=
JSON.parse(
localStorage.getItem(FINAL_STORAGE)
|| "[]"
);


/* =====================================
   GUARDAR
===================================== */

function guardar(){

  localStorage.setItem(
    STORAGE,
    JSON.stringify(unidades)
  );

  localStorage.setItem(
    FINAL_STORAGE,
    JSON.stringify(finalizadas)
  );

}


/* =====================================
   LISTA DE PLACAS
===================================== */

function cargarListaPlacas(){

  const select=
  document.getElementById("placaSelect");

  select.innerHTML=
  `<option value="">Seleccionar placa</option>`;

  const placas=[
    "TCA2222",
    "TEA9111",
    "HDV4065",
    "TCA2209",
    "TCA2211"
  ];

  /*
   Agregar también cualquier placa
   nueva que ya haya sido guardada.
  */

  unidades.forEach(u=>{

    if(
      u.placa &&
      !placas.includes(u.placa)
    ){
      placas.push(u.placa);
    }

  });


  placas.forEach(placa=>{

    const option=
    document.createElement("option");

    option.value=placa;
    option.textContent=placa;

    select.appendChild(option);

  });


  const nueva=
  document.createElement("option");

  nueva.value="__NUEVA__";
  nueva.textContent="➕ Nueva placa...";

  select.appendChild(nueva);

}


/* =====================================
   SELECCIONAR PLACA
===================================== */

function seleccionarPlaca(){

  const valor=
  document.getElementById(
    "placaSelect"
  ).value;

  const caja=
  document.getElementById(
    "newPlateBox"
  );

  if(valor==="__NUEVA__"){

    caja.style.display="block";

  }else{

    caja.style.display="none";

    document.getElementById(
      "nuevaPlaca"
    ).value="";

  }

}


/* =====================================
   HORA
===================================== */

function horaActual(){

  return new Date().toLocaleTimeString(
    "es-HN",
    {
      hour:"2-digit",
      minute:"2-digit",
      hour12:true
    }
  );

}


/* =====================================
   PROGRAMAR UNIDAD
===================================== */

function agregarUnidad(){

  const select=
  document.getElementById(
    "placaSelect"
  );

  let placa=select.value;


  if(placa==="__NUEVA__"){

    placa=document
      .getElementById("nuevaPlaca")
      .value
      .trim()
      .toUpperCase();

  }


  const destino=
  document.getElementById(
    "destino"
  ).value;


  if(!placa){

    alert("Selecciona una placa.");

    return;

  }


  if(!destino){

    alert("Selecciona el destino.");

    return;

  }


  const existe=
  unidades.some(
    u=>u.placa===placa
  );


  if(existe){

    alert(
      "La placa "+placa+
      " ya está programada."
    );

    return;

  }


  unidades.push({

    placa:placa,
    destino:destino,
    ubicacion:"",
    hora:"",
    estado:"En ruta"

  });


  guardar();

  document.getElementById(
    "placaSelect"
  ).value="";

  document.getElementById(
    "destino"
  ).value="";

  document.getElementById(
    "nuevaPlaca"
  ).value="";

  document.getElementById(
    "newPlateBox"
  ).style.display="none";


  cargarListaPlacas();

  mostrar();


  alert(
    "✅ "+placa+
    " fue programada correctamente."
  );

}


/* =====================================
   ACTUALIZAR UBICACIÓN
===================================== */

function actualizar(i){

  const campo=
  document.getElementById(
    "ubicacion_"+i
  );

  const ubicacion=
  campo.value.trim();


  if(!ubicacion){

    alert(
      "Escribe la ubicación."
    );

    return;

  }


  /*
   SOLO cambia ubicación y hora.
   Placa y destino permanecen.
  */

  unidades[i].ubicacion=
    ubicacion;

  unidades[i].hora=
    horaActual();

  unidades[i].estado=
    "En ruta";


  guardar();

  mostrar();

  generarReporte();


  setTimeout(()=>{

    document
      .getElementById("reporte")
      .scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

  },100);

}


/* =====================================
   FINALIZAR
===================================== */

function finalizar(i){

  const unidad=
    unidades[i];


  if(!confirm(
    "¿Finalizar la unidad "+
    unidad.placa+"?"
  )) return;


  unidad.estado=
    "Finalizada";

  unidad.hora=
    horaActual();


  finalizadas.push(unidad);

  unidades.splice(i,1);


  guardar();

  cargarListaPlacas();

  mostrar();

  generarReporte();

}


/* =====================================
   ELIMINAR
===================================== */

function eliminar(i){

  const unidad=
    unidades[i];


  if(!confirm(
    "¿Eliminar la unidad "+
    unidad.placa+"?"
  )) return;


  unidades.splice(i,1);

  guardar();

  cargarListaPlacas();

  mostrar();

  generarReporte();

}


/* =====================================
   MOSTRAR UNIDADES
===================================== */

function mostrar(){

  const contenedor=
    document.getElementById(
      "unidades"
    );


  if(unidades.length===0){

    contenedor.innerHTML=
    `
      <div class="empty">
        No hay unidades programadas.
      </div>
    `;

  }else{

    contenedor.innerHTML="";


    unidades.forEach(
      function(u,i){

        const div=
          document.createElement("div");

        div.className="unit";


        div.innerHTML=`

          <div class="unit-head">

            <h3>🚛 ${u.placa}</h3>

            <span class="badge">
              ${u.estado}
            </span>

          </div>


          <div class="info">

            🎯 <strong>Destino:</strong>
            ${u.destino}

            <br>

            📍 <strong>Ubicado en:</strong>
            ${u.ubicacion || "Sin actualización"}

            <br>

            🕐 <strong>Hora:</strong>
            ${u.hora || "Sin actualización"}

          </div>


          <div class="update">

            <input
              id="ubicacion_${i}"
              type="text"
              placeholder="Nueva ubicación">

            <button
              onclick="actualizar(${i})">

              🔄 Actualizar

            </button>

          </div>


          <div class="actions">

            <button
              class="green"
              onclick="finalizar(${i})">

              Finalizar

            </button>

            <button
              class="red"
              onclick="eliminar(${i})">

              Eliminar

            </button>

          </div>

        `;


        contenedor.appendChild(div);

      }
    );

  }


  mostrarFinalizadas();

  generarReporte();

}


/* =====================================
   GENERAR REPORTE
===================================== */

function generarReporte(){

  const reporte=
    document.getElementById(
      "reporte"
    );


  const actualizadas=
    unidades.filter(
      u=>u.ubicacion && u.hora
    );


  if(actualizadas.length===0){

    reporte.textContent=
      "Aún no hay unidades actualizadas.";

    return;

  }


  let texto=
    "📋 REPORTE DE SEGUIMIENTO\n\n";


  actualizadas.forEach(
    function(u,i){

      texto+=
        "🚛 "+u.placa+"\n";

      texto+=
        "📍 Ubicado en: "+
        u.ubicacion+"\n";

      texto+=
        "🎯 Destino: "+
        u.destino+"\n";

      texto+=
        "🕐 Hora: "+
        u.hora+"\n";


      if(
        i<actualizadas.length-1
      ){

        texto+=
          "\n━━━━━━━━━━━━━━━━━━━━\n\n";

      }

    }
  );


  reporte.textContent=texto;

}


/* =====================================
   COPIAR REPORTE
===================================== */

function copiarReporte(){

  generarReporte();


  const texto=
    document.getElementById(
      "reporte"
    ).textContent;


  if(
    texto===
    "Aún no hay unidades actualizadas."
  ){

    alert(
      "Primero actualiza una unidad."
    );

    return;

  }


  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(texto)
      .then(()=>{

        alert(
          "✅ Reporte copiado."
        );

      })
      .catch(()=>{

        copiarAlternativo(texto);

      });

  }else{

    copiarAlternativo(texto);

  }

}


/* =====================================
   COPIADO ALTERNATIVO
===================================== */

function copiarAlternativo(texto){

  const area=
    document.createElement(
      "textarea"
    );

  area.value=texto;

  area.style.position="fixed";
  area.style.left="-9999px";

  document.body.appendChild(area);

  area.select();


  try{

    document.execCommand("copy");

    alert(
      "✅ Reporte copiado."
    );

  }catch(e){

    alert(
      "No se pudo copiar automáticamente."
    );

  }


  document.body.removeChild(area);

}


/* =====================================
   LIMPIAR ACTUALIZACIONES
===================================== */

function limpiarActualizaciones(){

  if(unidades.length===0)
    return;


  if(!confirm(
    "¿Limpiar ubicación y hora de todas las unidades?"
  )) return;


  unidades.forEach(u=>{

    u.ubicacion="";
    u.hora="";

  });


  guardar();

  mostrar();

}


/* =====================================
   FINALIZADAS
===================================== */

function mostrarFinalizadas(){

  const contenedor=
    document.getElementById(
      "finalizadas"
    );


  if(finalizadas.length===0){

    contenedor.innerHTML=
    `
      <div class="empty">
        No hay unidades finalizadas.
      </div>
    `;

    return;

  }


  contenedor.innerHTML="";


  finalizadas.forEach(u=>{

    const div=
      document.createElement("div");

    div.className="unit";


    div.innerHTML=`

      <div class="unit-head">

        <h3>🚛 ${u.placa}</h3>

        <span class="badge">
          Finalizada
        </span>

      </div>


      <div class="info">

        🎯 <strong>Destino:</strong>
        ${u.destino}

        <br>

        📍 <strong>Ubicado en:</strong>
        ${u.ubicacion || "Sin ubicación"}

        <br>

        🕐 <strong>Hora:</strong>
        ${u.hora || "Sin hora"}

      </div>

    `;


    contenedor.appendChild(div);

  });

}


/* =====================================
   INICIAR
===================================== */

guardar();

cargarListaPlacas();

mostrar();

</script>

</body>
</html>
