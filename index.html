<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<meta name="theme-color"
      content="#111827">

<title>Seguimiento de Unidades V5</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#f3f4f6;
color:#111827;
font-family:Arial,sans-serif;
}

.app{
max-width:650px;
margin:auto;
padding:16px;
}

.header{
text-align:center;
margin:10px 0 18px;
}

.icon{
font-size:44px;
}

h1{
font-size:26px;
margin:4px 0;
}

.sub{
color:#6b7280;
}

.card{
background:#fff;
border-radius:18px;
padding:18px;
margin-bottom:16px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
font-size:19px;
margin:0 0 14px;
}

label{
display:block;
font-weight:700;
margin:10px 0 7px;
}

select,
input{
width:100%;
padding:14px;
border:1px solid #d1d5db;
border-radius:11px;
font-size:16px;
background:#fff;
}

.row{
display:flex;
gap:9px;
}

.grow{
flex:1;
}

button{
border:0;
border-radius:11px;
padding:14px;
font-weight:700;
font-size:15px;
cursor:pointer;
}

.primary{
width:100%;
background:#111827;
color:#fff;
margin-top:14px;
}

.add{
background:#e5e7eb;
color:#111827;
white-space:nowrap;
}

.destinos{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
}

.destinos button{
background:#e5e7eb;
color:#111827;
font-size:13px;
}

.destinos button.selected{
background:#111827;
color:#fff;
}

.item{
border:1px solid #e5e7eb;
border-radius:12px;
padding:13px;
margin-top:10px;
}

.item strong{
font-size:17px;
}

.meta{
font-size:14px;
line-height:1.6;
margin-top:6px;
color:#374151;
}

.item-actions{
display:flex;
gap:8px;
margin-top:10px;
}

.item-actions button{
flex:1;
padding:10px;
font-size:13px;
}

.danger{
background:#fee2e2;
color:#991b1b;
}

.secondary{
background:#e5e7eb;
color:#111827;
}

.report{
white-space:pre-wrap;
background:#f9fafb;
border:1px solid #e5e7eb;
border-radius:11px;
padding:13px;
line-height:1.55;
font-size:14px;
}

.copy{
width:100%;
background:#16a34a;
color:#fff;
margin-top:10px;
}

.empty{
text-align:center;
color:#6b7280;
padding:14px;
}

.small{
font-size:13px;
color:#6b7280;
margin-top:7px;
}

@media(max-width:430px){

.destinos{
grid-template-columns:1fr;
}

.row{
align-items:stretch;
}

}

</style>

</head>

<body>

<div class="app">


<div class="header">

<div class="icon">
📋
</div>

<h1>
Seguimiento de Unidades
</h1>

<div class="sub">
Reporte consolidado para WhatsApp
</div>

</div>


<!-- REGISTRO -->

<section class="card">

<h2>
Registrar seguimiento
</h2>


<label>
Placa
</label>


<div class="row">

<div class="grow">

<select id="placa">

<option value="">
Seleccione una placa
</option>

</select>

</div>


<button
class="add"
onclick="agregarPlaca()">

＋ Placa

</button>

</div>


<label>
Ubicado en
</label>


<input
id="ubicado"
type="text"
placeholder="Ej. Siguatepeque"
autocomplete="off"
>


<label>
Destino
</label>


<div class="destinos">

<button
data-destino="CD SPS">

CD SPS

</button>


<button
data-destino="CD COMAYAGUA">

CD COMAYAGUA

</button>


<button
data-destino="CD JUTICALPA">

CD JUTICALPA

</button>

</div>


<button
class="primary"
onclick="registrar()">

AGREGAR AL REPORTE

</button>


<div class="small">

La hora se registra automáticamente.

</div>

</section>



<!-- UNIDADES -->

<section class="card">

<h2>
Unidades del reporte
</h2>

<div id="registros"></div>

</section>



<!-- REPORTE -->

<section class="card">

<h2>
Reporte consolidado
</h2>


<div
id="reporte"
class="report">

Aún no hay unidades en el reporte.

</div>


<button
class="copy"
onclick="copiarReporte()">

📲 COPIAR PARA WHATSAPP

</button>


<button
class="secondary"
style="width:100%;margin-top:9px"
onclick="limpiarReporte()">

Limpiar reporte actual

</button>

</section>



<!-- PLACAS -->

<section class="card">

<h2>
Placas guardadas
</h2>

<div id="placas"></div>

</section>



<!-- HISTORIAL -->

<section class="card">

<h2>
Historial
</h2>

<div id="historial"></div>

</section>


</div>



<script>


const CLAVE_PLACAS =
"seguimiento_placas_v5";


const CLAVE_REPORTE =
"seguimiento_reporte_v5";


const CLAVE_HISTORIAL =
"seguimiento_historial_v5";


let placas =
JSON.parse(
localStorage.getItem(
CLAVE_PLACAS
)
||
'["TCA2222","TEA9111"]'
);


let registros =
JSON.parse(
localStorage.getItem(
CLAVE_REPORTE
)
||
"[]"
);


let historial =
JSON.parse(
localStorage.getItem(
CLAVE_HISTORIAL
)
||
"[]"
);


let destinoSeleccionado =
"";



/* =========================
   HORA
========================= */


function obtenerHora(){

return new Intl.DateTimeFormat(
"es-HN",
{
hour:"2-digit",
minute:"2-digit",
hour12:true
}
).format(
new Date()
);

}



/* =========================
   FECHA
========================= */


function obtenerFecha(){

return new Intl.DateTimeFormat(
"es-HN",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
).format(
new Date()
);

}



/* =========================
   SEGURIDAD
========================= */


function escapar(texto){

return String(texto)

.replace(
/[&<>"']/g,

function(c){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c];

}

);

}



/* =========================
   GUARDAR
========================= */


function guardarDatos(){

localStorage.setItem(
CLAVE_PLACAS,
JSON.stringify(placas)
);


localStorage.setItem(
CLAVE_REPORTE,
JSON.stringify(registros)
);


localStorage.setItem(
CLAVE_HISTORIAL,
JSON.stringify(historial)
);

}



/* =========================
   SELECTOR DE PLACAS
========================= */


function mostrarSelector(){

const selector =
document.getElementById(
"placa"
);


selector.innerHTML =
'<option value="">Seleccione una placa</option>';


placas.forEach(

function(placa){

const opcion =
document.createElement(
"option"
);

opcion.value =
placa;

opcion.textContent =
placa;

selector.appendChild(
opcion
);

}

);

}



/* =========================
   AGREGAR PLACA
========================= */


function agregarPlaca(){

const nueva =
prompt(
"Escribe la nueva placa:"
);


if(!nueva){

return;

}


const placa =
nueva
.trim()
.toUpperCase();


if(!placa){

return;

}


if(
placas.includes(
placa
)
){

alert(
"Esa placa ya está guardada."
);

return;

}


placas.push(
placa
);


placas.sort();


guardarDatos();


mostrarSelector();

mostrarPlacas();


document.getElementById(
"placa"
).value =
placa;

}



/* =========================
   MOSTRAR PLACAS
========================= */


function mostrarPlacas(){

const contenedor =
document.getElementById(
"placas"
);


if(
placas.length === 0
){

contenedor.innerHTML =
'<div class="empty">No hay placas guardadas.</div>';

return;

}


contenedor.innerHTML =
"";


placas.forEach(

function(placa,index){

const div =
document.createElement(
"div"
);


div.className =
"item";


div.innerHTML =

`
<strong>
🚛 ${escapar(placa)}
</strong>

<div class="item-actions">

<button
class="danger"
onclick="eliminarPlaca(${index})">

Eliminar

</button>

</div>
`;


contenedor.appendChild(
div
);

}

);

}



/* =========================
   ELIMINAR PLACA
========================= */


function eliminarPlaca(index){

const placa =
placas[index];


if(
!confirm(
"¿Eliminar la placa " +
placa +
"?"
)
){

return;

}


placas.splice(
index,
1
);


guardarDatos();


mostrarSelector();

mostrarPlacas();

}



/* =========================
   DESTINO
========================= */


document
.querySelectorAll(
"[data-destino]"
)
.forEach(

function(boton){

boton.onclick =
function(){

destinoSeleccionado =
boton.dataset.destino;


document
.querySelectorAll(
"[data-destino]"
)
.forEach(

function(b){

b.classList.remove(
"selected"
);

}
);


boton.classList.add(
"selected"
);

};

}
);



/* =========================
   REGISTRAR
========================= */


function registrar(){

const placa =
document.getElementById(
"placa"
).value;


const ubicado =
document.getElementById(
"ubicado"
).value.trim();


if(!placa){

alert(
"Selecciona una placa."
);

return;

}


if(!ubicado){

alert(
"Escribe dónde está ubicada la unidad."
);

return;

}


if(!destinoSeleccionado){

alert(
"Selecciona el destino."
);

return;

}


/*
No permitimos duplicar
una misma placa dentro
del reporte actual.
*/


if(
registros.some(
function(registro){

return registro.placa === placa;

}
)
){

alert(
"Esa placa ya está en el reporte actual. Puedes editarla."
);

return;

}


registros.push({

placa:placa,

ubicado:ubicado,

destino:destinoSeleccionado,

hora:obtenerHora()

});


guardarDatos();


mostrarRegistros();


document.getElementById(
"ubicado"
).value =
"";


destinoSeleccionado =
"";


document
.querySelectorAll(
"[data-destino]"
)
.forEach(

function(boton){

boton.classList.remove(
"selected"
);

}
);

}



/* =========================
   MOSTRAR REGISTROS
========================= */


function mostrarRegistros(){

const contenedor =
document.getElementById(
"registros"
);


if(
registros.length === 0
){

contenedor.innerHTML =
'<div class="empty">Todavía no hay unidades en este reporte.</div>';

generarReporte();

return;

}


contenedor.innerHTML =
"";


registros.forEach(

function(registro,index){

const div =
document.createElement(
"div"
);


div.className =
"item";


div.innerHTML =

`
<strong>
🚛 ${escapar(registro.placa)}
</strong>

<div class="meta">

📍 Ubicado en:
<b>
${escapar(registro.ubicado)}
</b>

<br>

🎯 Destino:
<b>
${escapar(registro.destino)}
</b>

<br>

🕐 Hora:
<b>
${escapar(registro.hora)}
</b>

</div>


<div class="item-actions">

<button
class="secondary"
onclick="editarRegistro(${index})">

Editar

</button>


<button
class="danger"
onclick="eliminarRegistro(${index})">

Eliminar

</button>

</div>
`;


contenedor.appendChild(
div
);

}

);


generarReporte();

}



/* =========================
   EDITAR
========================= */


function editarRegistro(index){

const registro =
registros[index];


document.getElementById(
"placa"
).value =
registro.placa;


document.getElementById(
"ubicado"
).value =
registro.ubicado;


destinoSeleccionado =
registro.destino;


document
.querySelectorAll(
"[data-destino]"
)
.forEach(

function(boton){

if(
boton.dataset.destino ===
registro.destino
){

boton.classList.add(
"selected"
);

}else{

boton.classList.remove(
"selected"
);

}

}
);


registros.splice(
index,
1
);


guardarDatos();


mostrarRegistros();


window.scrollTo({
top:0,
behavior:"smooth"
});

}



/* =========================
   ELIMINAR REGISTRO
========================= */


function eliminarRegistro(index){

if(
!confirm(
"¿Eliminar esta unidad del reporte?"
)
){

return;

}


registros.splice(
index,
1
);


guardarDatos();


mostrarRegistros();

}



/* =========================
   GENERAR REPORTE
========================= */


function generarReporte(){

const caja =
document.getElementById(
"reporte"
);


if(
registros.length === 0
){

caja.textContent =
"Aún no hay unidades en el reporte.";

return;

}


let texto =
"📋 REPORTE DE SEGUIMIENTO\n\n";


registros.forEach(

function(registro,index){

texto +=

"🚛 " +
registro.placa +
"\n" +

"📍 Ubicado en: " +
registro.ubicado +
"\n" +

"🎯 Destino: " +
registro.destino +
"\n" +

"🕐 Hora: " +
registro.hora +
"\n";


if(
index <
registros.length - 1
){

texto +=
"\n";

}

}
);


caja.textContent =
texto;

}



/* =========================
   COPIAR REPORTE
========================= */


function copiarReporte(){

if(
registros.length === 0
){

alert(
"No hay unidades en el reporte."
);

return;

}


const texto =
document.getElementById(
"reporte"
).textContent;


historial.unshift({

fecha:
obtenerFecha() +
" " +
obtenerHora(),

cantidad:
registros.length,

texto:
texto

});


historial =
historial.slice(
0,
20
);


guardarDatos();


mostrarHistorial();


navigator.clipboard
.writeText(
texto
)
.then(

function(){

alert(
"Reporte copiado."
);

}

)
.catch(

function(){

alert(
"No se pudo copiar automáticamente."
);

}

);

}



/* =========================
   LIMPIAR REPORTE
========================= */


function limpiarReporte(){

if(
registros.length === 0
){

return;

}


if(
!confirm(
"¿Limpiar el reporte actual?"
)
){

return;

}


registros =
[];


guardarDatos();


mostrarRegistros();

}



/* =========================
   HISTORIAL
========================= */


function mostrarHistorial(){

const contenedor =
document.getElementById(
"historial"
);


if(
historial.length === 0
){

contenedor.innerHTML =
'<div class="empty">Todavía no hay historial.</div>';

return;

}


contenedor.innerHTML =
"";


historial
.slice(
0,
20
)
.forEach(

function(item,index){

const div =
document.createElement(
"div"
);


div.className =
"item";


div.innerHTML =

`
<strong>
${escapar(item.fecha)}
</strong>

<div class="meta">

${item.cantidad}
unidad(es)

</div>

<div
class="report"
style="margin-top:8px">

${escapar(item.texto)}

</div>


<button
class="secondary"
style="width:100%;margin-top:8px"
onclick="copiarHistorial(${index})">

📲 Copiar

</button>
`;


contenedor.appendChild(
div
);

}
);

}



/* =========================
   COPIAR HISTORIAL
========================= */


function copiarHistorial(index){

const texto =
historial[index].texto;


navigator.clipboard
.writeText(
texto
)
.then(

function(){

alert(
"Reporte copiado."
);

}

)
.catch(

function(){

alert(
"No se pudo copiar."
);

}

);

}



/* =========================
   INICIAR APP
========================= */


mostrarSelector();

mostrarPlacas();

mostrarRegistros();

mostrarHistorial();

</script>

</body>
</html>
