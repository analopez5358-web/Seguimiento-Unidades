<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Seguimiento de Unidades V5.2</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:Arial,sans-serif;
}

header{
  background:#111827;
  color:white;
  padding:24px 20px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;
  color:#d1d5db;
}

.container{
  max-width:650px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin:14px 0 7px;
}

input,
select{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  background:white;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}

.btn-primary{
  background:#2563eb;
  color:white;
}

.btn-success{
  background:#16a34a;
  color:white;
}

.btn-danger{
  background:#dc2626;
  color:white;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}

.unit{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:16px;
  margin-top:14px;
}

.unit-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.unit-header h3{
  margin:0;
  font-size:21px;
}

.badge{
  padding:7px 10px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  background:#dcfce7;
  color:#166534;
}

.info{
  margin-top:12px;
  line-height:1.7;
}

.info strong{
  color:#374151;
}

.unit-buttons{
  display:flex;
  gap:8px;
}

.unit-buttons button{
  flex:1;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:25px 10px;
}

.report{
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
  white-space:pre-line;
  line-height:1.6;
}

footer{
  text-align:center;
  color:#6b7280;
  padding:25px;
  font-size:13px;
}

@media(max-width:500px){

  .container{
    padding:12px;
  }

  header h1{
    font-size:24px;
  }

  .unit-buttons{
    flex-direction:column;
  }

}

</style>
</head>

<body>


<header>

  <h1>
    Seguimiento de Unidades
  </h1>

  <p>
    Control y monitoreo de unidades
  </p>

</header>


<div class="container">


<!-- =========================
     FORMULARIO
========================= -->

<div class="card">

  <h2>
    Agregar unidad
  </h2>


  <label>
    Unidad / Placa
  </label>


  <select id="unidad">

    <option value="">
      Seleccionar placa
    </option>

    <option value="TCA2222">
      TCA2222
    </option>

    <option value="TEA9111">
      TEA9111
    </option>

  </select>


  <label>
    Ubicado en
  </label>


  <input
    id="ubicacion"
    type="text"
    placeholder="Ej. El Nance"
  >


  <label>
    Destino
  </label>


  <select id="destino">

    <option value="">
      Seleccionar destino
    </option>

    <option value="CD JUTICALPA">
      CD JUTICALPA
    </option>

    <option value="CD SPS">
      CD SPS
    </option>

    <option value="CD COMAYAGUA">
      CD COMAYAGUA
    </option>

  </select>


  <label>
    Estado
  </label>


  <select id="estado">

    <option value="En ruta">
      En ruta
    </option>

    <option value="Detenida">
      Detenida
    </option>

    <option value="Ubicado en">
      Ubicado en
    </option>

    <option value="Llegó al CD JUTICALPA">
      Llegó al CD JUTICALPA
    </option>

    <option value="Llegó al CD SPS">
      Llegó al CD SPS
    </option>

    <option value="Llegó al CD COMAYAGUA">
      Llegó al CD COMAYAGUA
    </option>

    <option value="Finalizada">
      Finalizada
    </option>

  </select>


  <button
    class="btn-primary"
    onclick="agregarUnidad()">

    + Agregar unidad

  </button>

</div>



<!-- =========================
     UNIDADES
========================= -->

<div class="card">

  <h2>
    Unidades
  </h2>


  <div id="listaUnidades">

    <div class="empty">
      No hay unidades registradas.
    </div>

  </div>

</div>



<!-- =========================
     REPORTE
========================= -->

<div class="card">

  <h2>
    Reporte
  </h2>


  <div
    id="reporte"
    class="report">

    Aún no hay información para generar el reporte.

  </div>


  <button
    class="btn-success"
    onclick="copiarReporte()">

    📲 Copiar reporte

  </button>


  <button
    class="btn-secondary"
    onclick="limpiarUnidades()">

    Limpiar unidades

  </button>

</div>


</div>


<footer>

Seguimiento de Unidades V5.2

</footer>



<script>


let unidades = [];



/* =========================
   CARGAR DATOS
========================= */


function cargarDatos(){

  const datos =
    localStorage.getItem(
      "seguimientoUnidades"
    );


  if(datos){

    try{

      unidades =
        JSON.parse(datos);

    }catch(e){

      unidades = [];

    }

  }


  mostrarUnidades();

}



/* =========================
   GUARDAR DATOS
========================= */


function guardarDatos(){

  localStorage.setItem(
    "seguimientoUnidades",
    JSON.stringify(unidades)
  );

}



/* =========================
   HORA
========================= */


function obtenerHora(){

  const ahora =
    new Date();


  return ahora.toLocaleTimeString(
    "es-HN",
    {
      hour:"2-digit",
      minute:"2-digit",
      hour12:true
    }
  );

}



/* =========================
   AGREGAR UNIDAD
========================= */


function agregarUnidad(){

  const unidad =
    document.getElementById(
      "unidad"
    ).value;


  const ubicacion =
    document.getElementById(
      "ubicacion"
    ).value.trim();


  const destino =
    document.getElementById(
      "destino"
    ).value;


  const estado =
    document.getElementById(
      "estado"
    ).value;


  if(!unidad){

    alert(
      "Selecciona la placa de la unidad."
    );

    return;

  }


  if(!ubicacion){

    alert(
      "Escribe dónde está ubicada la unidad."
    );

    return;

  }


  if(!destino){

    alert(
      "Selecciona el destino."
    );

    return;

  }


  const existente =
    unidades.find(
      u => u.unidad === unidad
    );


  if(existente){

    alert(
      "Esta unidad ya está registrada."
    );

    return;

  }


  unidades.push({

    unidad:unidad,

    ubicacion:ubicacion,

    destino:destino,

    estado:estado,

    hora:obtenerHora()

  });


  guardarDatos();

  mostrarUnidades();

  limpiarFormulario();

}



/* =========================
   MOSTRAR UNIDADES
========================= */


function mostrarUnidades(){

  const contenedor =
    document.getElementById(
      "listaUnidades"
    );


  if(unidades.length === 0){

    contenedor.innerHTML =
      `
      <div class="empty">
        No hay unidades registradas.
      </div>
      `;

    generarReporte();

    return;

  }


  contenedor.innerHTML =
    "";


  unidades.forEach(
    (u,index)=>{

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "unit";


      div.innerHTML = `

        <div class="unit-header">

          <h3>
            🚛 ${u.unidad}
          </h3>

          <span class="badge">
            ${u.estado}
          </span>

        </div>


        <div class="info">

          📍 <strong>Ubicado en:</strong>
          ${u.ubicacion}

          <br>

          🎯 <strong>Destino:</strong>
          ${u.destino}

          <br>

          🕐 <strong>Hora:</strong>
          ${u.hora}

        </div>


        <div class="unit-buttons">

          <button
            class="btn-primary"
            onclick="cambiarEstado(${index})">

            Cambiar estado

          </button>


          <button
            class="btn-danger"
            onclick="eliminarUnidad(${index})">

            Eliminar

          </button>

        </div>

      `;


      contenedor.appendChild(
        div
      );

    }
  );


  generarReporte();

}



/* =========================
   CAMBIAR ESTADO
========================= */


function cambiarEstado(index){

  const estados = [

    "En ruta",

    "Detenida",

    "Ubicado en",

    "Llegó al CD JUTICALPA",

    "Llegó al CD SPS",

    "Llegó al CD COMAYAGUA",

    "Finalizada"

  ];


  let mensaje =
    "Selecciona el nuevo estado:\n\n";


  estados.forEach(
    (estado,i)=>{

      mensaje +=
        `${i + 1}. ${estado}\n`;

    }
  );


  const opcion =
    prompt(
      mensaje
    );


  if(opcion === null){

    return;

  }


  const numero =
    parseInt(opcion);


  if(
    isNaN(numero) ||
    numero < 1 ||
    numero > estados.length
  ){

    alert(
      "Opción no válida."
    );

    return;

  }


  unidades[index].estado =
    estados[numero - 1];


  unidades[index].hora =
    obtenerHora();


  guardarDatos();

  mostrarUnidades();

}



/* =========================
   ELIMINAR
========================= */


function eliminarUnidad(index){

  if(
    !confirm(
      "¿Deseas eliminar esta unidad?"
    )
  ){

    return;

  }


  unidades.splice(
    index,
    1
  );


  guardarDatos();

  mostrarUnidades();

}



/* =========================
   GENERAR REPORTE
========================= */


function generarReporte(){

  const reporte =
    document.getElementById(
      "reporte"
    );


  if(unidades.length === 0){

    reporte.textContent =
      "Aún no hay información para generar el reporte.";

    return;

  }


  /*
  FORMATO OFICIAL:

  📋 REPORTE DE SEGUIMIENTO

  🚛 TCA2222
  📍 Ubicado en: El Nance
  🎯 Destino: CD JUTICALPA
  🕐 Hora: 02:01 a. m.
  */


  let texto =
    "📋 REPORTE DE SEGUIMIENTO\n\n";


  unidades.forEach(
    (u,index)=>{

      texto +=
        "🚛 " +
        u.unidad +
        "\n";


      texto +=
        "📍 Ubicado en: " +
        u.ubicacion +
        "\n";


      texto +=
        "🎯 Destino: " +
        u.destino +
        "\n";


      texto +=
        "🕐 Hora: " +
        u.hora +
        "\n";


      if(
        index <
        unidades.length - 1
      ){

        texto +=
          "\n";

      }

    }
  );


  reporte.textContent =
    texto;

}



/* =========================
   COPIAR REPORTE
========================= */


function copiarReporte(){

  generarReporte();


  const texto =
    document.getElementById(
      "reporte"
    ).textContent;


  if(
    !navigator.clipboard
  ){

    alert(
      "No se pudo copiar automáticamente."
    );

    return;

  }


  navigator.clipboard
    .writeText(
      texto
    )
    .then(
      ()=>{

        alert(
          "Reporte copiado correctamente."
        );

      }
    )
    .catch(
      ()=>{

        alert(
          "No se pudo copiar el reporte."
        );

      }
    );

}



/* =========================
   LIMPIAR FORMULARIO
========================= */


function limpiarFormulario(){

  document.getElementById(
    "unidad"
  ).value =
    "";


  document.getElementById(
    "ubicacion"
  ).value =
    "";


  document.getElementById(
    "destino"
  ).value =
    "";


  document.getElementById(
    "estado"
  ).value =
    "En ruta";

}



/* =========================
   LIMPIAR UNIDADES
========================= */


function limpiarUnidades(){

  if(
    unidades.length === 0
  ){

    return;

  }


  if(
    !confirm(
      "¿Seguro que deseas eliminar todas las unidades?"
    )
  ){

    return;

  }


  unidades = [];


  guardarDatos();

  mostrarUnidades();

}



/* =========================
   INICIO
========================= */


cargarDatos();


</script>

</body>
</html>
